# docker-compose.yml
services:
  gluetun:
    # Pinned to the digest that was running when this stack was last verified.
    # Left floating, the switcher (which recreates gluetun) could pull a breaking
    # upstream release unattended. Bump deliberately, then re-verify routing.
    image: qmcgaw/gluetun@sha256:10b4895fde4499c2d1d9fbd8e681d040ede0efe8c6cfe5d0c51daf0461836ee8
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./gluetun:/gluetun
      - ./setup-gluetun.sh:/setup-gluetun.sh
      - ./gluetun-entrypoint.sh:/gluetun-entrypoint.sh
      - ./healthcheck.sh:/healthcheck.sh
    entrypoint: /gluetun-entrypoint.sh
    environment:
      # --- Add your Gluetun variables below ---
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      # --- Critical firewall settings for acting as a gateway ---
      - FIREWALL_OUTBOUND_SUBNETS=172.28.0.0/24,100.64.0.0/10
      # Disable Gluetun's built-in firewall to allow manual configuration.
      # Fail-closed is enforced manually in setup-gluetun.sh (FORWARD ... DROP).
      - FIREWALL=off
      # Control server (used by the health check and the country switcher).
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      # Gluetun v3.39.1+ requires auth on all control server routes by default.
      # Since port 8000 is only reachable from within the internal docker network
      # (172.28.0.0/24) and never exposed to the host or internet, no-auth is safe.
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    networks:
      vpn-net:
        ipv4_address: 172.28.0.2 # Static IP for Gluetun
    restart: unless-stopped

  tailscale:
    # `stable` is the tag Tailscale recommends for container installs. The image
    # is re-pulled weekly by deploy/vpn-ts-update.sh (systemd timer on the host);
    # `tailscale set --auto-update` does not work in a container, since the
    # updated binary lands in the writable layer and is lost on recreate.
    image: tailscale/tailscale:stable
    container_name: tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.conf.all.rp_filter=0
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./tailscale:/var/lib/tailscale
      - ./start-tailscale.sh:/start-tailscale.sh
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_HOSTNAME=${TS_HOSTNAME}
      - TS_EXTRA_ARGS=--advertise-exit-node
    entrypoint: /start-tailscale.sh
    networks:
      vpn-net:
        ipv4_address: 172.28.0.3 # Static IP for Tailscale
    restart: unless-stopped
    depends_on:
      - gluetun

  # Web UI to switch VPN exit country, exposed over the tailnet via
  # `tailscale serve` (see start-tailscale.sh). Recreates gluetun via the
  # mounted docker socket. COMPOSE_PROJECT_NAME must match the stack's project
  # name (the directory name you run docker-compose from).
  switcher:
    build: ./switcher
    container_name: vpn-switcher
    environment:
      - ENV_FILE=${PWD}/.env
      - COMPOSE_FILE=${PWD}/docker-compose.yml
      - COMPOSE_PROJECT_NAME=vpn-ts
      - GLUETUN_URL=http://172.28.0.2:8000
      - LISTEN=:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
    networks:
      vpn-net:
        ipv4_address: 172.28.0.4 # Static IP for the switcher (referenced by tailscale serve)
    restart: unless-stopped
    depends_on:
      - gluetun

networks:
  vpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24